name: generate cards
# 自动生成卡片并发布到本仓,断点续传(sha 索引),PROGRESS.md 进度看板。
# 只读输入检出公开工厂仓 zqf20096327/ai_collect(README 43k/池),不需额外令牌;
# 卡片状态与产物推回本仓,用自带 GITHUB_TOKEN。
on:
  workflow_dispatch:
    inputs:
      trial:
        description: "本批卡片数(默认 600)"
        default: "600"
      concurrency:
        description: "并发(默认 6)"
        default: "6"
  schedule:
    - cron: "17 */2 * * *"   # 单批实测 ~100min,每 2h 一批刚好衔接;避开整点排队

permissions:
  contents: write

concurrency:
  group: generate-cards
  cancel-in-progress: false

jobs:
  gen:
    if: github.repository == 'zqf20096327/ai-repo-atlas'   # 防 fork 误烧 key
    runs-on: ubuntu-latest
    timeout-minutes: 120  # 兜底:脚本自带墙钟(s8 85 / s10 10)正常会在 ~105min 收尾
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 检出工厂仓(只读输入)
        uses: actions/checkout@v4
        with:
          repository: zqf20096327/ai_collect
          path: factory
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests jsonschema
      - name: 写 .env(密钥来自本仓 secrets)
        run: |
          {
            echo "AI_BASE_URL=${{ secrets.AI_BASE_URL }}"
            echo "AI_API_KEY=${{ secrets.AI_API_KEY }}"
            echo "AI_MODEL=${{ secrets.AI_MODEL }}"
            echo "AI_THINKING=${{ secrets.AI_THINKING }}"
            echo "AI_MAX_TOKENS=${{ secrets.AI_MAX_TOKENS }}"
          } > .env
      - name: s8 批跑(解读)
        env:
          FACTORY_ROOT: ${{ github.workspace }}/factory
          AI_WALL_MIN: "85"          # 85min 硬截止;派发在 75min 停(-600s 预留)
        run: |
          python s8_interpret.py \
            --trial "${{ github.event.inputs.trial || '600' }}" \
            --concurrency "${{ github.event.inputs.concurrency || '6' }}"
      - name: s10 新卡打标
        env:
          FACTORY_ROOT: ${{ github.workspace }}/factory
          AI_WALL_MIN: "15"          # 打标 ~67卡/min,15min 可清 ~1000 张,先追平积压
          AI_WALL_RESERVE_S: "120"   # 打标单卡秒级,预留 2min 够在途收尾
        run: python s10_tags.py tag --missing --concurrency 6
      - name: s12 每日曲线点
        env:
          FACTORY_ROOT: ${{ github.workspace }}/factory
        run: python s12_points.py
      - name: 公开边界剥离(去 raw_verdicts/xcheck)
        run: python tools/strip_for_public.py
      - name: s11 导出(catalog+卡片+曲线+PROGRESS)
        env:
          FACTORY_ROOT: ${{ github.workspace }}/factory
        run: python s11_export.py --out .
      - name: commit & push
        if: always()
        run: |
          git config user.name "atlas-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/ data/ trends/ llms.txt PROGRESS.md
          if git diff --cached --quiet; then
            echo "本批无变化(可能已全部完成)"
          else
            N=$(git diff --cached --numstat -- state/s8_cards | wc -l)
            git commit -m "cards: $(date -u +%F_%H:%M) 自动生成 +${N} 卡"
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin main || true
              git push origin main && { echo "已发布 +${N} 卡"; exit 0; }
              echo "推送撞车,40s 后重试($i/5)"; sleep 40
            done
            echo "::warning::推送未成功(断点续传下次自动重做)"
          fi
